.chat-msg{margin-bottom:5px;font-size:13px;line-height:1.5}.chat-msg .s{font-weight:700;margin-right:4px}

.chat-input-wrap{display:flex;gap:6px;margin-top:8px}

.feed-in input::placeholder{color:rgba(255,255,255,0.3)}

.char-card .cname{color:#fff;font-size:14px;font-weight:700;margin-bottom:2px}

.start-btn2{margin-top:18px;background:linear-gradient(135deg,#4A90D9,#357ABD);color:#fff;border:none;padding:14px 48px;font-size:18px;border-radius:30px;cursor:pointer;transition:all .2s;font-weight:600;opacity:0.4;pointer-events:none}
.start-btn2.ready{opacity:1;pointer-events:auto}

#title-screen .start-btn{background:linear-gradient(135deg,#4A90D9,#357ABD);color:#fff;border:none;padding:14px 48px;font-size:18px;border-radius:30px;cursor:pointer;transition:all .2s;font-weight:600}
#title-screen .start-btn:hover{transform:scale(1.05);box-shadow:0 6px 24px rgba(74,144,217,0.4)}
#minigame-overlay{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;backdrop-filter:blur(4px)}

#story-body::-webkit-scrollbar{width:6px}#story-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:3px}

.inv-body{padding:16px 20px;overflow-y:auto;max-height:calc(80vh - 54px);scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.15) transparent}

class Ch{
  constructor(col,row,cl,name,isP){this.col=col;this.row=row;this.cl=cl;this.name=name;this.isP=isP;this.tc=col;this.tr=row;this.mv=false}
  get sp(){return ts(this.col,this.row)}
  get depth(){return this.col+this.row}
  update(dt){if(this.mv){const dc=this.tc-this.col,dr=this.tr-this.row,d=Math.sqrt(dc*dc+dr*dr);if(d<.05){this.col=this.tc;this.row=this.tr;this.mv=false}else{const s=Math.min((this.isP?SPD:SPD*.4)*dt,d);let nx=this.col+(dc/d)*s,ny=this.row+(dr/d)*s;const w=rWalls(this.col,this.row,nx,ny);nx=w.col;ny=w.row;if(canWalk(nx,ny)){this.col=nx;this.row=ny}else if(canWalk(nx,this.row)){this.col=nx}else if(canWalk(this.col,ny)){this.row=ny}else{this.mv=false}}}}
  draw(){const p=this.sp;dR(p.x,p.y,this.cl,0,this.name,this.isP)}
  dist(o){return Math.sqrt((this.col-o.col)**2+(this.row-o.row)**2)}
}

const ROOM_KW={'会议室':'meeting','会议':'meeting','办公':'office','办公区':'office','餐厅':'kitchen','吃饭':'kitchen','饭':'kitchen','娱乐':'ai_demo','娱乐室':'ai_demo','实验':'robot_lab','研发':'robot_lab','研发室':'robot_lab','机器人':'robot_lab','储藏':'course_dev','储藏室':'course_dev','走廊':'corridor'};
function sendFeedMsg(text){
  if(!text.trim())return;
  addFeed('alex','<span class="sp" style="color:'+PC.body+'">' +player.name+'</span>：'+text);
  // find room keyword for movement
  let targetRoom=null;
  for(const[kw,rm]of Object.entries(ROOM_KW)){if(text.includes(kw)){targetRoom=rm;break}}
  // find topic for response
  let topic='general';
  if(/机器人|robot|舵机|传感器|3D打印|电路|硬件|PCB|焊接|嵌入式/.test(text))topic='robot';
  else if(/课程|教学|教案|学生|教育|课堂|课件|青少年|学员|学术|论文|研究|实验/.test(text))topic='course';
  else if(/智能体|模型|训练|agent|AI|大模型|部署/.test(text))topic='agent';
  else if(/工作|忙|任务|项目|代码|开发|编程|bug|功能|需求|评审/.test(text))topic='work';
  else if(/吃|喝|饿|咖啡|食物|餐|饭/.test(text))topic='food';
  else if(/累|休息|困|疲惫|放松/.test(text))topic='tired';
  else if(/会议|开会|meeting|讨论/.test(text))topic='meeting';
  else if(/音乐|吉他|鼓|键盘|娱乐/.test(text))topic='agent';
  // pick NPCs to respond based on role relevance
  let responders=[...npcs].sort(()=>Math.random()-.5);
  if(topic==='robot')responders=responders.sort((a,b)=>(a.name==='KK'||a.name==='周周'?-1:1)-(b.name==='KK'||b.name==='周周'?-1:1));
  if(topic==='work'||topic==='meeting')responders=responders.sort((a,b)=>(a.name==='鸽子'?-1:1)-(b.name==='鸽子'?-1:1));
  const r1=responders[0];
  setTimeout(()=>{feedChat(r1.name,pickR(r1.name,topic))},800+Math.random()*1200);
  const r2=responders[1];
  setTimeout(()=>{feedChat(r2.name,pickR(r2.name,topic))},2200+Math.random()*1500);
  // if room mentioned, move NPCs there
  if(targetRoom&&targetRoom!=='corridor'){
    const dests=NDEST[{meeting:'meeting_state',office:'working',robot_lab:'lab_work',ai_demo:'testing',kitchen:'kitchen',course_dev:'course_dev'}[targetRoom]]||NDEST.idle;
    npcs.forEach((n,i)=>{
      if(n.inEvt)return;
      const tgt=dests[i%dests.length];
      const fr=gra(n.col,n.row);
      n.wps=cwp(n.col,fr,tgt.col,tgt.row,targetRoom);
      n.wi=0;n.st=0;n.state='moving';
    });
  }
}

function startPacman(){
  const box=document.getElementById('mgContent');
  const wrap=document.createElement('div');wrap.style.cssText='display:flex;gap:12px;justify-content:center;align-items:flex-start';

  cvs.style.cssText='display:block;background:#F7F7F7;border:2px solid rgba(255,255,255,0.2);border-radius:10px;transform:scale('+sc+');transform-origin:top center';
  wrap.appendChild(cvs);
  const lbDiv=document.createElement('div');lbDiv.id='sideLB';lbDiv.style.cssText='width:180px;background:rgba(20,20,35,0.95);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:10px;max-height:'+Math.round(400*sc)+'px;overflow-y:auto';
  wrap.appendChild(lbDiv);box.appendChild(wrap);
  const c2=cvs.getContext('2d'),W=1000,H=400;
  const GY=330;
  const GRAVITY=1800,JUMP_VEL=-580;

  let speed=350,score=0,hiScore=0,lives=3,level=1,over=false,lbShown=false;
  let started=false,nightMode=false,nightAlpha=0;

  let dino={x:80,y:GY,vy:0,jumping:false,frame:0,frameT:0,invT:0};
  const DINO_W=44,DINO_H=48;

  let obstacles=[],obsCD=1.5;
  let groundX=0;
  let clouds=[];for(let i=0;i<4;i++)clouds.push({x:Math.random()*W,y:40+Math.random()*80,w:60+Math.random()*40,s:30+Math.random()*20});
  let stars=[];for(let i=0;i<30;i++)stars.push({x:Math.random()*W,y:Math.random()*200,s:1+Math.random()*2});
  let particles=[];

  function addParticle(x,y,color,count){for(let i=0;i<count;i++)particles.push({x,y,vx:(Math.random()-.5)*120,vy:-Math.random()*100,life:0.4+Math.random()*0.3,color,size:2+Math.random()*3})}

  function spawnObs(){
    const types=[];
    types.push({type:'cactus_s',w:20,h:40});
    types.push({type:'cactus_l',w:28,h:55});
    types.push({type:'cactus_g',w:50,h:40});
    if(level>=2)types.push({type:'rock',w:36,h:30});
    if(level>=2)types.push({type:'bird',w:42,h:30,fly:true,flyY:GY-70});
    if(level>=3)types.push({type:'bird',w:42,h:30,fly:true,flyY:GY-130});
    if(level>=5)types.push({type:'double_cactus',w:45,h:60});
    const t=types[Math.floor(Math.random()*types.length)];
    obstacles.push({x:W+20,y:t.fly?t.flyY:GY,...t,passed:false});
  }

  function dinoHitbox(){return{x:dino.x,y:dino.y-DINO_H,w:DINO_W,h:DINO_H}}
  function obsHitbox(o){return{x:o.x,y:o.y-o.h,w:o.w,h:o.h}}
  function collides(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

  function drawGround(){
    c2.fillStyle='#535353';c2.fillRect(0,GY,W,H-GY);
    c2.strokeStyle='#666';c2.lineWidth=1;c2.beginPath();c2.moveTo(0,GY);c2.lineTo(W,GY);c2.stroke();
    c2.fillStyle=nightMode?'#4A4A4A':'#5A5A5A';
    for(let i=0;i<40;i++){
      const bx=((i*53-groundX*0.5)%W+W)%W;
      c2.fillRect(bx,GY+8+Math.sin(i*7)*4,Math.max(2,8+Math.sin(i*3)*4),2);
    }
  }

  function drawDino(){
    const inv=dino.invT>0;
    if(inv&&Math.floor(dino.invT*10)%2===0)return;
    const dx=dino.x,dy=dino.y;
    c2.fillStyle=nightMode?'#E0E0E0':'#535353';
    c2.fillRect(dx+10,dy-DINO_H,28,DINO_H-10);
      c2.fillRect(dx+20,dy-DINO_H-14,24,20);
      c2.fillStyle='#FFF';c2.fillRect(dx+34,dy-DINO_H-10,8,8);
      c2.fillStyle='#000';c2.fillRect(dx+38,dy-DINO_H-8,4,4);
      c2.fillStyle=nightMode?'#E0E0E0':'#535353';
      c2.fillRect(dx+28,dy-DINO_H+2,16,4);
      c2.fillRect(dx+6,dy-DINO_H+16,8,4);
      c2.fillRect(dx+4,dy-DINO_H+20,4,8);
      c2.fillRect(dx,dy-DINO_H+8,14,6);
      c2.fillRect(dx-4,dy-DINO_H+4,8,6);
      c2.fillStyle=nightMode?'#E0E0E0':'#535353';
      if(dino.jumping){
        c2.fillRect(dx+14,dy,6,10);c2.fillRect(dx+28,dy,6,10);
      }else{
        const lf=dino.frame%2;
        c2.fillRect(dx+(lf?14:16),dy,6,lf?12:8);
        c2.fillRect(dx+(lf?28:26),dy,6,lf?8:12);
      }
  }

  function drawObstacle(o){
    c2.fillStyle=nightMode?'#CCC':'#535353';
    if(o.type.startsWith('cactus')||o.type==='double_cactus'){
      const cx=o.x,cy=o.y;
      c2.fillRect(cx+o.w/2-4,cy-o.h,8,o.h);
      c2.fillRect(cx,cy-o.h*0.7,8,4);
      c2.fillRect(cx,cy-o.h*0.7-8,4,12);
      if(o.w>30){
        c2.fillRect(cx+o.w-8,cy-o.h*0.5,8,4);
        c2.fillRect(cx+o.w-4,cy-o.h*0.5-8,4,12);
      }
      if(o.type==='cactus_g'){
        c2.fillRect(cx+o.w*0.6,cy-o.h+8,8,o.h-8);
        c2.fillRect(cx+o.w*0.6+8,cy-o.h*0.5,4,8);
      }
      if(o.type==='double_cactus'){
        c2.fillRect(cx+o.w*0.6,cy-o.h,8,o.h);
        c2.fillRect(cx+o.w*0.6+8,cy-o.h*0.6,4,8);
        c2.fillRect(cx+o.w*0.6-4,cy-o.h*0.4,4,10);
      }
    }else if(o.type==='rock'){
      c2.beginPath();c2.moveTo(o.x,o.y);c2.lineTo(o.x+6,o.y-o.h);
      c2.lineTo(o.x+o.w-8,o.y-o.h+4);c2.lineTo(o.x+o.w,o.y);c2.closePath();c2.fill();
      c2.fillStyle=nightMode?'#BBB':'#666';
      c2.beginPath();c2.moveTo(o.x+8,o.y-o.h+4);c2.lineTo(o.x+o.w/2,o.y-o.h-6);
      c2.lineTo(o.x+o.w-6,o.y-o.h+2);c2.closePath();c2.fill();
    }else if(o.type==='bird'){
      const bx=o.x,by=o.y;
      c2.fillStyle=nightMode?'#CCC':'#535353';
      c2.fillRect(bx+8,by-8,o.w-16,12);
      c2.fillRect(bx+o.w-8,by-6,12,4);
      const wf=Math.sin(Date.now()*0.01)*10;
      c2.beginPath();c2.moveTo(bx+10,by-8);c2.lineTo(bx+o.w/2,by-22+wf);c2.lineTo(bx+o.w-10,by-8);c2.closePath();c2.fill();
      c2.fillStyle='#FFF';c2.fillRect(bx+o.w-6,by-8,4,4);
    }
  }

    clouds.forEach(cl=>{

  }

  function drawStars(){

  }

  function reset(){
    dino={x:80,y:GY,vy:0,jumping:false,frame:0,frameT:0,invT:0};
    obstacles=[];obsCD=1.5;speed=350;score=0;lives=3;level=1;
    over=false;lbShown=false;started=true;
    particles=[];groundX=0;nightMode=false;nightAlpha=0;
  }

  let lastT2=0,sideLBcd=0;
  function tick(ts){
    if(!mgActive){return}
    if(lastT2===0)lastT2=ts;
    const dt=Math.min((ts-lastT2)/1000,0.05);lastT2=ts;

    const bg=nightMode?'#1A1A2E':'#F7F7F7';
    c2.fillStyle=bg;c2.fillRect(0,0,W,H);

    if(nightMode){nightAlpha=Math.min(1,nightAlpha+dt*0.5);drawStars()}
    drawClouds();

    if(!started){
      drawGround();drawDino();drawStart();
      requestAnimationFrame(tick);return;
    }

    if(!over){
      groundX+=speed*dt;

      score+=Math.round(speed*dt*0.05);
      const newLv=Math.floor(score/500)+1;
      if(newLv>level){
        level=newLv;
        speed=350+level*25;
        if(level%4===0)nightMode=!nightMode;

      }
      if(score>hiScore)hiScore=score;

      if(dino.jumping){
        dino.vy+=GRAVITY*dt;
        dino.y+=dino.vy*dt;
        if(dino.y>=GY){dino.y=GY;dino.vy=0;dino.jumping=false}
      }
      dino.frameT+=dt;
      if(dino.frameT>0.1){dino.frameT=0;dino.frame++}
      if(dino.invT>0)dino.invT-=dt;

      obsCD-=dt;
      if(obsCD<=0){
        spawnObs();
        const minCD=Math.max(0.4,1.5-level*0.08);
        const maxCD=Math.max(0.8,2.5-level*0.1);
        obsCD=minCD+Math.random()*(maxCD-minCD);
      }

      obstacles.forEach(o=>{o.x-=speed*dt});
      obstacles=obstacles.filter(o=>{
        if(o.x+o.w<-10){
          if(!o.passed){o.passed=true;score+=10}
          return false;
        }
        return true;
      });

      clouds.forEach(cl=>{cl.x-=cl.s*dt;if(cl.x+cl.w<-20){cl.x=W+Math.random()*100;cl.y=40+Math.random()*80}});

      const dh=dinoHitbox();
      for(const o of obstacles){
        if(o.passed)continue;
        const oh=obsHitbox(o);
        const s=6;
        const da={x:dh.x+s,y:dh.y+s,w:dh.w-s*2,h:dh.h-s*2};
        const oa={x:oh.x+s,y:oh.y+s,w:oh.w-s*2,h:oh.h-s*2};
        if(collides(da,oa)){
          if(dino.invT<=0){
            lives--;
            addParticle(dino.x+20,dino.y-20,'#FF4444',12);
            if(lives<=0){over=true;lbShown=false}
            else{dino.invT=2;obstacles=obstacles.filter(ob=>ob.x>dino.x+100)}
          }
          break;
        }
        if(o.x+o.w<dino.x)o.passed=true;
      }

      particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.life-=dt});
      particles=particles.filter(p=>p.life>0);

      if(!dino.jumping&&Math.random()<0.3)addParticle(dino.x+5,dino.y,'rgba(150,150,150,0.5)',1);
    }

    drawGround();
    obstacles.forEach(drawObstacle);
    drawDino();
    drawParticles();
    drawHUD();

    sideLBcd++;if(sideLBcd%30===0)drawSideLB();

    if(over){
      if(!lbShown){
        lbShown=true;
        addScore('pacman',score,{level});drawSideLB();
        setTimeout(()=>{closeMinigame();setTimeout(()=>openMinigame('🏃 恐龙跑酷',()=>showLeaderboard('pacman',score)),120)},1500);
      }
      drawGameOver();
    }

    requestAnimationFrame(tick);
  }

  function onK(e){
    if(!mgActive)return;
    const k=e.key;
    if(k==='ArrowUp'||k===' '){
      e.preventDefault();
      if(!started){reset();return}
      if(over){reset();return}
      if(!dino.jumping){
        dino.jumping=true;dino.vy=JUMP_VEL;
        addParticle(dino.x+20,GY,'rgba(150,150,150,0.6)',5);
      }
    }
  }
  function onKU(e){}
  document.addEventListener('keydown',onK);
  document.addEventListener('keyup',onKU);
  const oc=closeMinigame;closeMinigame=function(){document.removeEventListener('keydown',onK);document.removeEventListener('keyup',onKU);oc()};
  requestAnimationFrame(tick);
}

// ==================== 打砖块 ====================
function startBreakout(){
  const box=document.getElementById('mgContent');
  const wrap=document.createElement('div');wrap.style.cssText='display:flex;gap:12px;justify-content:center;align-items:flex-start';
  const cvs=document.createElement('canvas');cvs.width=600;cvs.height=840;cvs.style.cssText='display:block;background:#1A1A2E;border:2px solid rgba(255,255,255,0.2);border-radius:10px';
  wrap.appendChild(cvs);
  // side leaderboard
  const lbDiv=document.createElement('div');lbDiv.id='sideLB2';lbDiv.style.cssText='width:180px;background:rgba(20,20,35,0.95);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:10px;max-height:840px;overflow-y:auto';
  wrap.appendChild(lbDiv);
  box.appendChild(wrap);
  const c2=cvs.getContext('2d'),W=600,H=840,BALL_R=8;
  let padW=100,padX=W/2-50,sc=0,lives=3,over=false,lbShown2=false;
  let level=1,bks=[],combo=0,particles=[];
  // multi-ball support
  let balls=[{x:W/2,y:H-36,dx:2,dy:-2}];
  const CLR=['#FF4444','#FF8844','#FFCC44','#44CC44','#4488FF','#AA44FF','#FF44AA','#44FFFF','#FFAA44','#44FF88'];
  // effect types: 0=normal, 1=multiball(🔵), 2=explode(💥), 3=tough(🛡️)
  const EFF_CLR=['','','','rgba(255,255,255,0.3)'];
  const EFF_ICON=['','','','🛡'];

  function makeLevel(lv){
    bks=[];const maxRows=10;const rows=Math.min(3+Math.floor(lv/2),maxRows);
    const maxCols=Math.min(6+Math.floor(lv/3),14);const cols=Math.min(maxCols,Math.floor(W/40));
    const bw=(W-20)/cols,bh=22;
    // max half screen = rows*bh+50 <= H/2
    const maxR=Math.floor((H/2-50)/bh);
    const actualRows=Math.min(rows,maxR);
    // varied layouts
    for(let r=0;r<actualRows;r++)for(let cl=0;cl<cols;cl++){
      // skip some bricks for variety
      if(lv%3===1&&(r+cl)%3===0)continue;
      if(lv%3===2&&r===Math.floor(actualRows/2)&&cl>1&&cl<cols-2)continue;
      const hp=lv>=5&&r<2?2:lv>=8&&r<3?3:1;
      bks.push({x:cl*bw+10,y:r*bh+50,w:bw-3,h:bh-3,a:hp,c:CLR[r%CLR.length],maxHp:hp,pts:10*lv,eff:0})}
    // add 10 random effect bricks
    const normals=bks.filter(b=>b.eff===0);
    const shuffled=[...normals].sort(()=>Math.random()-.5);
    for(let i=0;i<Math.min(10,shuffled.length);i++){
      const b=shuffled[i];
      const r=Math.random();
      if(r<0.33){b.eff=1;b.c='#4488FF'} // multiball
      else if(r<0.66){b.eff=2;b.c='#FF6600'} // explode
      else{b.eff=3;b.c='#888';b.maxHp=3+Math.floor(Math.random()*3);b.a=b.maxHp} // tough
    }
  }

  function resetBalls(){
    balls=[{x:W/2,y:H-36,dx:2,dy:-2}];
    const spd=2+level*0.3;const ang=Math.PI*0.3+Math.random()*Math.PI*0.4;
    balls[0].dx=spd*Math.cos(ang)*(Math.random()>.5?1:-1);
    balls[0].dy=-spd*Math.sin(ang);combo=0;
  }
  function spawnParticles(x,y,color,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:1,color})}

  function explodeBrick(bk){
    const cx=bk.x+bk.w/2,cy=bk.y+bk.h/2;
    for(let i=bks.length-1;i>=0;i--){
      const b=bks[i];if(b.a<=0||b===bk)continue;
      const dx=b.x+b.w/2-cx,dy=b.y+b.h/2-cy;
      if(Math.abs(dx)<bk.w*1.5&&Math.abs(dy)<bk.h*3){
        b.a--;sc+=b.pts;spawnParticles(b.x+b.w/2,b.y+b.h/2,b.c,5);
      }
    }
    spawnParticles(cx,cy,'#FF8800',12);
  }

  function drawSideLB2(){
    const el=document.getElementById('sideLB2');if(!el)return;
    const top=getTop('breakout');
    let html='<div style="color:#fff;font-size:13px;font-weight:700;margin-bottom:8px;text-align:center">🧱 排行榜</div>';
    if(top.length===0)html+='<div style="color:rgba(255,255,255,0.3);font-size:11px;text-align:center">暂无记录</div>';
    top.forEach((r,i)=>{
      const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':' '+(i+1);
      const lvl=r.level?' <span style="color:#88CCFF">Lv.'+r.level+'</span>':'';
      html+=`<div style="display:flex;align-items:center;gap:6px;padding:4px 6px;margin-bottom:3px;background:rgba(255,255,255,0.04);border-radius:6px;font-size:11px"><span>${medal}</span><span style="color:#fff;flex:1">${r.name}${lvl}</span><span style="color:#FFD700;font-weight:700">${r.score}</span></div>`;
    });
    html+='<div style="border-top:1px solid rgba(255,255,255,0.08);margin-top:8px;padding-top:8px">';
    html+=`<div style="color:rgba(255,255,255,0.5);font-size:10px">当前: Lv.${level}</div>`;
    html+=`<div style="color:#FFD700;font-size:14px;font-weight:700">分数: ${sc}</div>`;
    html+=`<div style="color:#88CCFF;font-size:11px;margin-top:4px">球数: ${balls.length}</div>`;
    html+='</div>';
    el.innerHTML=html;
  }

  makeLevel(1);resetBalls();drawSideLB2();

  function draw(){
    c2.fillStyle='#0D0D1A';c2.fillRect(0,0,W,H);
    c2.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<30;i++){const sx=(i*137+level*53)%W,sy=(i*97+sc)%H;c2.fillRect(sx,sy,2,2)}
    // bricks
    bks.forEach(b=>{if(b.a<=0)return;
      const alpha=b.a<b.maxHp?0.5+0.5*(b.a/b.maxHp):1;
      c2.globalAlpha=alpha;
      c2.fillStyle=b.c;c2.beginPath();c2.roundRect(b.x,b.y,b.w,b.h,3);c2.fill();
      c2.fillStyle='rgba(255,255,255,0.15)';c2.fillRect(b.x+2,b.y+1,b.w-4,b.h*0.35);
      // effect indicators
      if(b.eff===1){c2.fillStyle='rgba(255,255,255,0.7)';c2.font='bold 10px Arial';c2.textAlign='center';c2.fillText('🔵',b.x+b.w/2,b.y+b.h/2+3)}
      else if(b.eff===2){c2.fillStyle='rgba(255,255,255,0.7)';c2.font='bold 10px Arial';c2.textAlign='center';c2.fillText('💥',b.x+b.w/2,b.y+b.h/2+3)}
      else if(b.eff===3){c2.fillStyle='rgba(255,255,255,0.7)';c2.font='bold 9px Arial';c2.textAlign='center';c2.fillText('🛡'+b.a,b.x+b.w/2,b.y+b.h/2+3)}
      else if(b.maxHp>1){c2.fillStyle='rgba(255,255,255,0.7)';c2.font='bold 10px Arial';c2.textAlign='center';c2.fillText(b.a,b.x+b.w/2,b.y+b.h/2+3)}
      c2.globalAlpha=1});
    // particles
    particles.forEach(p=>{c2.globalAlpha=p.life;c2.fillStyle=p.color;c2.fillRect(p.x-2,p.y-2,4,4);c2.globalAlpha=1});
    // paddle
    const grad=c2.createLinearGradient(padX,H-18,padX+padW,H-18);grad.addColorStop(0,'#4A90D9');grad.addColorStop(1,'#357ABD');
    c2.fillStyle=grad;c2.beginPath();c2.roundRect(padX,H-18,padW,12,6);c2.fill();
    c2.fillStyle='rgba(255,255,255,0.3)';c2.fillRect(padX+4,H-17,padW-8,4);
    // balls
    balls.forEach(bl=>{
      c2.fillStyle='#FFD700';c2.shadowColor='#FFD700';c2.shadowBlur=12;c2.beginPath();c2.arc(bl.x,bl.y,BALL_R,0,Math.PI*2);c2.fill();c2.shadowBlur=0;
      c2.fillStyle='rgba(255,215,0,0.15)';c2.beginPath();c2.arc(bl.x-bl.dx*2,bl.y-bl.dy*2,BALL_R*0.8,0,Math.PI*2);c2.fill();
    });
    // HUD
    c2.fillStyle='rgba(0,0,0,0.5)';c2.fillRect(0,0,W,42);
    c2.fillStyle='#FFF';c2.font='bold 20px "PingFang SC"';c2.textAlign='left';c2.fillText('🧱 第 '+level+' 关',14,28);
    c2.font='bold 18px Arial';c2.fillText('Score: '+sc,200,28);
    c2.textAlign='right';c2.font='18px Arial';c2.fillStyle='#FF6666';
    let hearts='';for(let i=0;i<lives;i++)hearts+='❤';c2.fillText(hearts,W-14,28);
    if(combo>=3){c2.fillStyle='#FFD700';c2.font='bold 14px Arial';c2.textAlign='center';c2.fillText('🔥 '+combo+'x COMBO!',W/2,28)}
    if(balls.length>1){c2.fillStyle='#88CCFF';c2.font='bold 12px Arial';c2.textAlign='center';c2.fillText('x'+balls.length+' 球!',W/2,14)}
    // level transition
    if(bks.every(b=>b.a<=0)&&!over){
      level++;sc+=level*50;makeLevel(level);resetBalls();
      padW=Math.max(50,100-level*3);drawSideLB2();
      c2.fillStyle='rgba(0,0,0,0.6)';c2.fillRect(0,0,W,H);
      c2.fillStyle='#FFD700';c2.font='bold 32px Arial';c2.textAlign='center';c2.fillText('🎉 第 '+level+' 关!',W/2,H/2-10);

  function upd(){
    if(over)return;

      const bl=balls[bi];
      bl.x+=bl.dx;bl.y+=bl.dy;
      if(bl.x<=BALL_R||bl.x>=W-BALL_R){bl.dx=-bl.dx;bl.x=Math.max(BALL_R,Math.min(W-BALL_R,bl.x))}

        bl.dy=-Math.abs(bl.dy);

          if(b.a<=0&&b.eff===1){

              const ang=Math.random()*Math.PI*0.8-Math.PI*0.4;

    }

  function tick(){if(!mgActive){draw();return}upd();draw();if(fc%15===0)drawSideLB2();requestAnimationFrame(tick)}
  function onK(e){if(over||!mgActive)return;if(e.key==='ArrowLeft'){padX=Math.max(0,padX-30);e.preventDefault()}else if(e.key==='ArrowRight'){padX=Math.min(W-padW,padX+30);e.preventDefault()}}
  document.addEventListener('keydown',onK);const oc=closeMinigame;closeMinigame=function(){document.removeEventListener('keydown',onK);oc()};
  draw();requestAnimationFrame(tick)}


// ==================== 贪吃蛇 ====================
function startSnake(){
  const box=document.getElementById('mgContent');
  const wrap=document.createElement('div');wrap.style.cssText='display:flex;gap:12px;justify-content:center;align-items:flex-start';
  const cvs=document.createElement('canvas');cvs.width=2800;cvs.height=2800;const scale=Math.min(1,(innerHeight-60)/2800);cvs.style.cssText='display:block;background:#0D0D1A;border:2px solid rgba(255,255,255,0.15);border-radius:10px;transform:scale('+scale+');transform-origin:top center';
  wrap.appendChild(cvs);
  const lbDiv=document.createElement('div');lbDiv.id='sideLB3';lbDiv.style.cssText='width:180px;background:rgba(20,20,35,0.95);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:10px;max-height:'+Math.round(2800*scale)+'px;overflow-y:auto;flex-shrink:0';
  wrap.appendChild(lbDiv);
  box.appendChild(wrap);
  const c2=cvs.getContext('2d'),COLS=56,ROWS=56,SZ=48,PAD=40,CW=2800;
  const aiColors=[{h:'#E84444',b:'#C03030',n:'赤蛇'},{h:'#E8A844',b:'#C08830',n:'金蛇'},{h:'#44A8E8',b:'#3088C0',n:'蓝蛇'},{h:'#BB44E8',b:'#9030B0',n:'紫蛇'},{h:'#CCCCCC',b:'#999999',n:'银蛇'}];
  const DIRS=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];

  let chests=[],chestTimer=0,lives=0;

  function mkSnake(x,y,dx,dy,len,isP,aiIdx){const b=[];for(let i=0;i<len;i++)b.push({x:x-dx*i,y:y-dy*i});return{body:b,dir:{x:dx,y:dy},ndir:{x:dx,y:dy},isP,aiIdx,alive:true,spd:isP?130:140,accum:0}}
  function spawnFood(){const sizes=[{sz:1,r:14,color:'#F44',pts:1},{sz:3,r:18,color:'#F94',pts:3},{sz:5,r:22,color:'#FD4',pts:5}];const s=sizes[Math.random()<0.5?0:Math.random()<0.6?1:2];let f;let tries=0;do{f={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS),...s};tries++}while(tries<200&&(snakes.some(sk=>sk.body.some(b=>b.x===f.x&&b.y===f.y))||foods.some(fo=>fo.x===f.x&&fo.y===f.y)||chests.some(ch=>ch.x===f.x&&ch.y===f.y)));return f}
  function spawnChest(){let ch;let tries=0;do{ch={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS),timer:8000};tries++}while(tries<200&&(snakes.some(sk=>sk.body.some(b=>b.x===ch.x&&b.y===ch.y))||foods.some(f=>f.x===ch.x&&f.y===ch.y)||chests.some(c=>c.x===ch.x&&c.y===ch.y)));return ch}
  function init(){snakes=[mkSnake(14,28,1,0,3,true,-1),mkSnake(42,14,0,1,3,false,0),mkSnake(7,49,-1,0,3,false,1),mkSnake(49,42,0,-1,3,false,2),mkSnake(14,7,1,0,3,false,3),mkSnake(49,7,0,1,3,false,4)];foods=[];chests=[];chestTimer=0;lives=0;gameOver=false;winner='';started=false;for(let i=0;i<50;i++)foods.push(spawnFood());drawSnakeLB()}
  function drawSnakeLB(){
    const el=document.getElementById('sideLB3');if(!el)return;
    const top=getTop('snake');
    let html='<div style="color:#fff;font-size:13px;font-weight:700;margin-bottom:8px;text-align:center">🐍 排行榜</div>';
    if(top.length===0)html+='<div style="color:rgba(255,255,255,0.3);font-size:11px;text-align:center">暂无记录</div>';

      const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':' '+(i+1);
      html+=`<div style="display:flex;align-items:center;gap:6px;padding:4px 6px;margin-bottom:3px;background:rgba(255,255,255,0.04);border-radius:6px;font-size:11px"><span>${medal}</span><span style="color:#fff;flex:1">${r.name}</span><span style="color:#FFD700;font-weight:700">${r.score}</span></div>`;
    });
    if(snakes&&snakes[0]){html+='<div style="border-top:1px solid rgba(255,255,255,0.08);margin-top:8px;padding-top:8px"><div style="color:#FFD700;font-size:14px;font-weight:700">长度: '+snakes[0].body.length+'</div><div style="color:rgba(255,255,255,0.5);font-size:10px">❤️x'+lives+'</div></div>'}
    el.innerHTML=html;
  }
  function respawnPlayer(){const player=snakes[0];const spots=[{x:14,y:28},{x:42,y:14},{x:7,y:49},{x:49,y:42},{x:28,y:28},{x:28,y:7},{x:28,y:49}];const grid=buildGrid(player);let spot=spots[0];for(const s of spots){if(!grid[s.y*COLS+s.x]){spot=s;break}}player.body=[{x:spot.x,y:spot.y}];player.dir={x:1,y:0};player.ndir={x:1,y:0};player.alive=true;player.spd=130;player.accum=0}

  function buildGrid(excludeSnake){const g=new Uint8Array(COLS*ROWS);
    snakes.forEach(sk=>{if(!sk.alive||sk===excludeSnake)return;sk.body.forEach(s=>{if(s.x>=0&&s.x<COLS&&s.y>=0&&s.y<ROWS)g[s.y*COLS+s.x]=1})});
    return g}

  function floodCount(sx,sy,grid,limit){if(sx<0||sx>=COLS||sy<0||sy>=ROWS||grid[sy*COLS+sx])return 0;
    const visited=new Uint8Array(COLS*ROWS);const q=[sx+sy*COLS];visited[sx+sy*COLS]=1;let cnt=0;
    while(q.length&&cnt<limit){const p=q.shift();const px=p%COLS,py=Math.floor(p/COLS);cnt++;
      for(const d of DIRS){const nx=px+d.x,ny=py+d.y,nk=ny*COLS+nx;
        if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&!visited[nk]&&!grid[nk]){visited[nk]=1;q.push(nk)}}}
    return cnt}

  function isSafe(nx,ny,grid){return nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&!grid[ny*COLS+nx]}

  function aiThink(sk){
    const h=sk.body[0];
    const grid=buildGrid(sk);
    for(let i=0;i<sk.body.length-1;i++){const s=sk.body[i];if(s.x>=0&&s.x<COLS&&s.y>=0&&s.y<ROWS)grid[s.y*COLS+s.x]=1}

      const tail=sk.body[sk.body.length-1];const ti=tail.y*COLS+tail.x;grid[ti]=0;
      const space=floodCount(nx,ny,grid,60);grid[ti]=1;
      let foodScore=0;
      for(const f of foods){const dist=Math.abs(f.x-nx)+Math.abs(f.y-ny);const sc=f.pts/(dist+1);if(sc>foodScore)foodScore=sc}
      // AI also targets chests for extra lives
      let chestScore=0;
      for(const ch of chests){const dist=Math.abs(ch.x-nx)+Math.abs(ch.y-ny);const sc=2/(dist+1);if(sc>chestScore)chestScore=sc}
      let headDanger=0;
      snakes.forEach(other=>{if(!other.alive||other===sk)return;const oh=other.body[0];
        if(Math.abs(oh.x-nx)+Math.abs(oh.y-ny)<=2)headDanger+=0.5;
        const onx=oh.x+other.dir.x,ony=oh.y+other.dir.y;if(onx===nx&&ony===ny)headDanger+=1});
      let cutoffBonus=0;
      snakes.forEach(other=>{if(!other.alive||other===sk||other.body.length>=sk.body.length)return;
        const oh=other.body[0];if(Math.abs(oh.x-nx)+Math.abs(oh.y-ny)<=3)cutoffBonus+=0.3});
      let wallPenalty=0;if(nx<=1||nx>=COLS-2)wallPenalty+=0.3;if(ny<=1||ny>=ROWS-2)wallPenalty+=0.3;
      candidates.push({d,score:space*0.15+(foodScore+chestScore)*3-headDanger*5+cutoffBonus-wallPenalty})}
    if(!candidates.length)return;
    candidates.sort((a,b)=>b.score-a.score);
    let pick;
    if(candidates.length>=3&&Math.random()<0.1)pick=candidates[2];
    else if(candidates.length>=2&&Math.random()<0.2)pick=candidates[1];
    else pick=candidates[0];
    const nx=h.x+pick.d.x,ny=h.y+pick.d.y;
    const tail=sk.body[sk.body.length-1];const ti=tail.y*COLS+tail.x;grid[ti]=0;

    sk.ndir={...pick.d}}

  function moveSnake(sk){
    sk.dir={...sk.ndir};const h=sk.body[0];const nh={x:h.x+sk.dir.x,y:h.y+sk.dir.y};

  function draw(){

function hideSwitchChar(){document.getElementById('switch-overlay').style.display='none'}
function doSwitchChar(newIdx){
  const newCh=ALL_CHARS[newIdx];
  const oldName=player.name;
  // find if this char is an NPC
  const npcIdx=npcs.findIndex(n=>n.name===newCh.name);
  if(npcIdx>=0){
    // swap: player takes NPC's position, NPC takes player's position
    const npc=npcs[npcIdx];
    const tmpCol=player.col,tmpRow=player.row,tmpCl={...player.cl};
    // player becomes new char at NPC position
    player.col=npc.col;player.row=npc.row;
    player.cl={body:newCh.body,dark:newCh.dark,light:newCh.light};
    player.name=newCh.name;player.tc=player.col;player.tr=player.row;player.mv=false;
    // NPC becomes old char at player's old position
    const oldChar=ALL_CHARS.find(c=>c.name===oldName);
    npc.col=tmpCol;npc.row=tmpRow;npc.cl={body:oldChar.body,dark:oldChar.dark,light:oldChar.light};
    npc.name=oldChar.name;npc.title=oldChar.title;npc.tc=npc.col;npc.tr=npc.row;npc.mv=false;
    PC={body:newCh.body,dark:newCh.dark,light:newCh.light};
  }else{
    // char not in game (shouldn't happen), just change player
    player.cl={body:newCh.body,dark:newCh.dark,light:newCh.light};
    player.name=newCh.name;PC={body:newCh.body,dark:newCh.dark,light:newCh.light}}
  addFeed('event','角色切换为 <b style="color:'+newCh.body+'">'+newCh.name+'</b> ('+newCh.title+')');
  hideSwitchChar()}

function genR(txt,npc){const p=NPC_P[npc.name];if(!p)return'...';let t='general';
  if(/你好|嗨|hi|hello|嘿|早|在吗/.test(txt))t='greet';
  else if(/机器人|robot|舵机|传感器|3D打印|电路|硬件|PCB|焊接|嵌入式|主板/.test(txt))t='robot';
  else if(/课程|教学|教案|学生|教育|课堂|课件|培训|老师|学校|青少年|孩子|学员|初中|小学|中学|年龄|客户需求|学术|论文|研究|实验/.test(txt))t='course';
  else if(/智能体|模型|训练|平台|agent|AI|大模型|部署|prompt|RAG/.test(txt))t='agent';
  else if(/工作|忙|任务|项目|代码|开发|编程|bug|功能|在做|干嘛|需求|评审/.test(txt))t='work';
  else if(/吃|喝|饿|咖啡|食物|餐|饭|零食/.test(txt))t='food';
  else if(/累|休息|困|疲惫|放松|疲倦/.test(txt))t='tired';
  else if(/会议|开会|meeting|讨论/.test(txt))t='meeting';
  else if(/你是谁|介绍|名字|叫什么|自我/.test(txt))t='intro';
  else if(/公司|lebot|产品/.test(txt))t='company';
  else if(/谢|thanks|thank/.test(txt))t='thanks';
  else if(/再见|拜拜|bye|回头|走了/.test(txt))t='bye';
  const rs=p.r[t]||p.r.general;return rs[Math.floor(Math.random()*rs.length)]}
function openDlg(npc){dlgAct=true;actNPC=npc;document.getElementById('dialogBox').style.display='block';document.getElementById('npcDot').style.backgroundColor=npc.cl.body;document.getElementById('npcNameLabel').textContent=npc.name+' - '+npc.title;const h=document.getElementById('chatHistory');h.innerHTML='';aCM(npc.name,npc.greet(),'n');const qo=document.getElementById('quickOpts');qo.innerHTML='';['你好！','在忙什么？','聊聊AI产品？','📖 你的故事','再见！'].forEach(t=>{const d=document.createElement('div');d.className='quick-opt';d.textContent=t;d.addEventListener('click',()=>{if(t.includes('故事')){closeDialog();openStory(npc.name)}else sMsg(t)});qo.appendChild(d)});document.getElementById('chatInput').value='';document.getElementById('chatInput').focus()}
function aCM(name,text,type){const h=document.getElementById('chatHistory');const d=document.createElement('div');d.className='chat-msg '+(type==='p'?'p':'n');d.innerHTML='<span class="s">'+name+'：</span>'+text;h.appendChild(d);h.scrollTop=h.scrollHeight}
function sMsg(text){if(!text.trim()||!actNPC)return;aCM(player.name,text,'p');feedChat(player.name,text);addBubble(player.name,text);setTimeout(()=>{const r=genR(text,actNPC);aCM(actNPC.name,r,'n');feedChat(actNPC.name,r)},300+Math.random()*500);document.getElementById('chatInput').value=''}
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sMsg(e.target.value)}})});
function closeDialog(){dlgAct=false;actNPC=null;document.getElementById('dialogBox').style.display='none'}

  {icon:'🖨️',name:'墨盒',qty:12},{icon:'💼',name:'文件夹',qty:35},{icon:'📋',name:'白板笔',qty:20},
  {icon:'🔋',name:'5号电池',qty:48},{icon:'🔌',name:'电源线',qty:15},{icon:'💻',name:'备用键盘',qty:6},
  {icon:'🖥️',name:'显示器',qty:3},{icon:'🧹',name:'清洁用品',qty:'∞'},{icon:'☕',name:'咖啡豆',qty:'2kg'},
  {icon:'📦',name:'快递纸箱',qty:22},{icon:'🧴',name:'洗手液',qty:8},{icon:'🗑️',name:'垃圾袋',qty:30},
  {icon:'✂️',name:'剪刀',qty:5},{icon:'📐',name:'螺丝刀套装',qty:4},{icon:'📦',name:'包装胶带',qty:10},
];
const INV_ROBOTS=[
  {icon:'🤖',name:'小坦克'},
  {icon:'🦾',name:'人形机器人'},
  {icon:'🎤',name:'随身麦克风'},

function openInv(){
  const b=document.getElementById('invBody');
  let h='<div class="inv-section">办公日用品</div>';
  INV_SUPPLIES.forEach(s=>{h+=`<div class="inv-row"><span class="inv-name">${s.icon} ${s.name}</span><span class="inv-qty">${s.qty}</span></div>`});
  h+='<div class="inv-section" style="margin-top:16px;color:#50E080">机器人产品 · 实时库存</div>';
  INV_ROBOTS.forEach(r=>{
    const qty=Math.floor(Math.random()*701)+300;
    h+=`<div class="inv-row"><span class="inv-name">${r.icon} ${r.name}</span><span class="inv-qty robot">${qty} 台</span></div>`});
  b.innerHTML=h;
  document.getElementById('inv-overlay').style.display='flex';
}
function closeInv(){document.getElementById('inv-overlay').style.display='none'}
window.openInv=openInv;window.closeInv=closeInv;
NPC.prototype.greet=function(){const p=NPC_P[this.name];if(p)return p.greet[Math.floor(Math.random()*p.greet.length)];return'你好！'};

// ==================== 玩家移动 ====================
function uP(dt){
  if(dlgAct||mgActive)return;
  if(ap.active){updateAP(dt);
    const gc=Math.round(player.col),gr=Math.round(player.row);
    if(gc>=0&&gc<MC&&gr>=0&&gr<MR)document.getElementById('roomLabel').textContent=RC[grk(gr,gc)]?RC[grk(gr,gc)].label:'走廊';
    return}
  const elapsed=(performance.now()-ap.lastInput)/1000;
  if(elapsed>20){activateAP();return}
  let dc=0,dr=0;
  if(keys['w']||keys['arrowup']){dc-=1;dr-=1}if(keys['s']||keys['arrowdown']){dc+=1;dr+=1}
  if(keys['a']||keys['arrowleft']){dc-=1;dr+=1}if(keys['d']||keys['arrowright']){dc+=1;dr-=1}
  if(dc||dr){const l=Math.sqrt(dc*dc+dr*dr);dc/=l;dr/=l;const sp=SPD*dt;let nx=player.col+dc*sp,ny=player.row+dr*sp;const w=rWalls(player.col,player.row,nx,ny);nx=w.col;ny=w.row;if(canWalk(nx,ny)){player.col=nx;player.row=ny}else if(canWalk(nx,player.row)){player.col=nx}else if(canWalk(player.col,ny)){player.row=ny}}
  const gc=Math.round(player.col),gr=Math.round(player.row);
  if(gc>=0&&gc<MC&&gr>=0&&gr<MR)document.getElementById('roomLabel').textContent=RC[grk(gr,gc)]?RC[grk(gr,gc)].label:'走廊';
}

// ==================== 门动画 ====================
function uD(dt){for(const[id,d]of Object.entries(DD)){const cc=dcx(d);let near=false;if(Math.sqrt((player.col-cc)**2+(player.row-d.y)**2)<2)near=true;for(const n of npcs)if(Math.sqrt((n.col-cc)**2+(n.row-d.y)**2)<2)near=true;if(near)d.anim=Math.min(1,d.anim+dt*3);else d.anim=Math.max(0,d.anim-dt*2);d.open=d.anim>.8}}

// ==================== 镜头 ====================
function uC(){camX=43;camY=716-cv.height/2}

// ==================== 小地图 ====================
function dM(){const mw=180,mh=160,sx=mw/MC,sy=mh/MR;mx.fillStyle='#1A1A2E';mx.fillRect(0,0,mw,mh);for(let r=0;r<MR;r++)for(let c=0;c<MC;c++){mx.fillStyle=RC[grk(r,c)].floor;mx.fillRect(c*sx,r*sy,sx-.5,sy-.5)}mx.fillStyle='rgba(0,0,0,0.3)';FL.forEach(f=>{if(!f.noBlock)for(let dr=0;dr<f.h;dr++)for(let dc=0;dc<f.w;dc++)mx.fillRect((f.col+dc)*sx,(f.row+dr)*sy,sx,sy)});for(const[id,d]of Object.entries(DD)){mx.fillStyle=d.anim>.8?'rgba(80,200,80,0.7)':'rgba(200,100,50,0.7)';mx.fillRect(d.x1*sx,(d.y-.3)*sy,(d.x2-d.x1)*sx,sy*.6)}npcs.forEach(n=>{mx.fillStyle=n.cl.body;mx.beginPath();mx.arc(n.col*sx,n.row*sy,3,0,Math.PI*2);mx.fill()});mx.fillStyle='#4A90D9';mx.strokeStyle='#FFF';mx.lineWidth=1.5;mx.beginPath();mx.arc(player.col*sx,player.row*sy,4,0,Math.PI*2);mx.fill();mx.stroke()}

// ==================== 主渲染 ====================
function gE(){const els=[];FL.forEach(f=>els.push({t:'f',it:f,d:f.col+f.row}));npcs.forEach(n=>els.push({t:'n',ch:n,d:n.col+n.row}));return els.sort((a,b)=>a.d-b.d)}
function render(){cx.clearRect(0,0,cv.width,cv.height);const bg=cx.createLinearGradient(0,0,0,cv.height);bg.addColorStop(0,'#2A2A3E');bg.addColorStop(1,'#1A1A2E');cx.fillStyle=bg;cx.fillRect(0,0,cv.width,cv.height);drawFloor();drawLabels();
  const wallSegs=tagWalls(bws());
  const glassW=wallSegs.filter(s=>s.glass);
  const solidW=wallSegs.filter(s=>!s.glass);
  // 1. glass walls first (behind everything)
  dWS(glassW);
  // 2. entities (furniture + NPCs)
  gE().forEach(el=>{if(el.t==='f')dFI(el.it);else if(el.t==='n'){el.ch.draw();if(player.dist(el.ch)<3&&!dlgAct){const s=el.ch.sp;cx.fillStyle='rgba(255,255,255,0.8)';cx.font='10px "PingFang SC"';cx.textAlign='center';cx.fillText('点击对话',s.x,s.y-50)}const s=el.ch.sp;const em={idle:'💤',working:'💻',testing:'🤖',lab_work:'🔧',kitchen:'☕',course_dev:'📚',meeting_state:'📋',event:'📢',moving:'🚶'};cx.font='12px Arial';cx.textAlign='center';cx.fillText(em[el.ch.state]||'💤',s.x+18,s.y-35)}});
  // 3. solid walls on top (cover glass at corners)
  dWS(solidW);
  // 4. doors
  drawDoors();
  // 5. player always on top
  player.draw();
  drawBubbles();
  const prm=gra(player.col,player.row);
  if(prm==='ai_demo'&&!dlgAct){const pp=ts(player.col,player.row);cx.fillStyle='rgba(255,255,255,0.5)';cx.font='10px "PingFang SC"';cx.textAlign='center';cx.fillText('按空格选择游戏',pp.x,pp.y-40)}
  if(prm==='kitchen'&&!dlgAct){const pp=ts(player.col,player.row);cx.fillStyle='rgba(255,255,255,0.5)';cx.font='10px "PingFang SC"';cx.textAlign='center';cx.fillText('按空格开始烹饪',pp.x,pp.y-40)}
}

// ==================== 游戏循环 ====================
let bgInited=false;
function loop(ts){if(!bgInited){bgInited=true;initGame();lastT=ts}const dt=Math.min((ts-lastT)/1000,.05);lastT=ts;fc++;
  if(started){uP(dt);if(ap.active&&player.mv)player.update(dt)}
  npcs.forEach(n=>n.update(dt));uD(dt);tryNPCChat(dt);updateGEVT(dt);updateBubbles(dt);uC();
  if(started){render();if(fc%15===0)dM()}
  else{renderBG()}
  requestAnimationFrame(loop)}
function renderBG(){cx.clearRect(0,0,cv.width,cv.height);const bg=cx.createLinearGradient(0,0,0,cv.height);bg.addColorStop(0,'#2A2A3E');bg.addColorStop(1,'#1A1A2E');cx.fillStyle=bg;cx.fillRect(0,0,cv.width,cv.height);drawFloor();drawLabels();
  const wallSegs=tagWalls(bws());const glassW=wallSegs.filter(s=>s.glass);const solidW=wallSegs.filter(s=>!s.glass);
  dWS(glassW);gE().forEach(el=>{if(el.t==='f')dFI(el.it);else if(el.t==='n'){el.ch.draw();const s=el.ch.sp;const em={idle:'💤',working:'💻',testing:'🤖',lab_work:'🔧',kitchen:'☕',course_dev:'📚',meeting_state:'📋',event:'📢',moving:'🚶'};cx.font='12px Arial';cx.textAlign='center';cx.fillText(em[el.ch.state]||'💤',s.x+18,s.y-35)}});dWS(solidW);drawDoors();drawBubbles()}
function startGame(){document.getElementById('title-screen').style.display='none';started=true;lastT=performance.now()}
requestAnimationFrame(loop);window.startGame=startGame;window.closeDialog=closeDialog;window.closeMinigame=closeMinigame;
function openStory(name){const s=CHAR_STORIES[name];if(!s)return;document.getElementById('story-title').textContent=name+'的背景故事';document.getElementById('story-body').textContent=s;document.getElementById('story-overlay').style.display='flex'}
function closeStory(){document.getElementById('story-overlay').style.display='none'}
window.openStory=openStory;window.closeStory=closeStory;
